  <script>
    // Terapkan ukuran teks (A+) sebelum halaman digambar, agar tidak "melompat"
    try { var t = localStorage.getItem('sitasi:teks'); if (t && t !== '100') document.documentElement.classList.add('teks-' + t); } catch (e) {}
    // Kenyamanan tampilan (menu profil): kontras tinggi & kurangi gerakan
    try { if (localStorage.getItem('sitasi:kontras') === '1') document.documentElement.classList.add('kontras-tinggi');
          if (localStorage.getItem('sitasi:gerak') === '1') document.documentElement.classList.add('gerak-kurang'); } catch (e) {}
  </script>
  <script>
    // Penjaga pemuatan: bila aplikasi belum tampil dalam 12 detik, tampilkan penyebab & tombol muat ulang bersih.
    (function () {
      var pesan = '';
      window.addEventListener('error', function (e) { pesan = pesan || (e.message || '') + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ')' : ''); });
      window.addEventListener('unhandledrejection', function (e) { pesan = pesan || String((e.reason && e.reason.message) || e.reason || ''); });
      setTimeout(function () {
        var b = document.querySelector('#app .boot'); if (!b) return;
        var d = document.createElement('div'); d.style.cssText = 'margin-top:18px;max-width:420px;text-align:center;font:15px/1.5 sans-serif;color:#374151';
        d.innerHTML = 'Pemuatan lebih lama dari biasanya. Periksa koneksi internet, lalu tekan tombol di bawah.' + (pesan ? '<br><small style="color:#9a3412">Rincian: ' + pesan.replace(/[<>&]/g, '') + '</small>' : '') +
          '<br><button id="muat-bersih" style="margin-top:12px;min-height:44px;padding:0 20px;border-radius:12px;border:0;background:#0f6b3a;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Muat ulang bersih</button>';
        (b.querySelector('.boot-isi') || b).appendChild(d);
        document.getElementById('muat-bersih').onclick = function () {
          try { sessionStorage.clear(); } catch (e) {}
          if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
          location.reload();
        };
      }, 12000);
    })();
  </script>
